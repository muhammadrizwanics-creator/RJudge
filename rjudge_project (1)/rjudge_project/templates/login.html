{% extends 'base.html' %}
{% block title %}Log in - RJudge{% endblock %}
{% block content %}
<main class="auth"><div class="aside"><h2>Welcome back</h2><p>Pick up where you stopped. Your solved problems and submissions are waiting.</p></div>
<div class="formside"><div class="card form"><h2>Log in</h2>
<form method="post">{% csrf_token %}
<label>Username or email<input name="username" required autocomplete="username" value="{{ request.POST.username }}"></label>
<label>Password<input name="password" type="password" required autocomplete="current-password"></label>
<p class="err">{{ error }}</p><button class="btn">Log in</button></form>
<p>New here? <a href="{% url 'register' %}">Create an account</a></p></div></div></main>
{% endblock %}
